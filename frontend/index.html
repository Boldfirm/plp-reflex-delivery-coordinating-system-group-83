<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reflex | Simple Delivery Management</title>
<link rel="stylesheet" href="css/styles.css">
<!-- Leaflet.js — Free maps, no API key needed -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>R</b><span><strong>Reflex</strong><small>Delivery Management</small></span></div>
    <div id="user" class="user hidden"></div>
    <nav id="nav" class="hidden">
      <button data-v="dashboard">⌂ <span>Dashboard</span></button>
      <button data-v="deliveries">▣ <span>Deliveries</span></button>
      <button data-v="create" class="retailer">＋ <span>New Delivery</span></button>
      <button data-v="map" class="dispatcher">🗺 <span>Live Map</span></button>
      <button data-v="riders" class="dispatcher">♙ <span>Riders</span></button>
    </nav>
    <button id="logout" class="logout hidden">Log out</button>
  </aside>

  <main>
    <section id="login">
      <div class="login-card">
        <div class="logo">R</div><h1>Welcome to Reflex</h1>
        <p>Simple delivery management for small businesses.</p>
        <form id="loginForm">
          <label>Email<input id="email" type="email" placeholder="e.g. mary@shop.co.ke" required></label>
          <label>Password
            <div class="pwd-wrap" style="position:relative">
              <input id="password" type="password" placeholder="••••••••" required style="width:100%;padding-right:42px">
              <button type="button" id="togglePwd" aria-label="Toggle password visibility" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;padding:6px;color:#667085;display:grid;place-items:center">
                <svg id="eyeIcon" viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </label>
          <button class="primary">Sign in</button>
        </form>
      </div>
    </section>

    <section id="app" class="hidden">
      <header>
        <div><small>REFLEX</small><h1 id="title">Dashboard</h1></div>
        <div class="header-actions"><span id="role"></span><button id="refresh" class="refresh">↻ Refresh</button></div>
      </header>
      <div id="content"></div>
    </section>
  </main>
</div>
<script src="js/app.js?v=27"></script>
</body></html>
